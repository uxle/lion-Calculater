[package]
name          = "lion-calculator"
version       = "0.1.0"
edition       = "2021"
# The committed Cargo.lock resolves transitive deps (e.g. accesskit 0.24)
# that use edition 2024, so the practical floor is 1.85.
rust-version  = "1.85"
description   = "Lion Calculator — Modern native calculator for LionOS"
authors       = ["Lion <lion@leonux.org>"]
license       = "MIT"

# Build:    cargo build --release
# Run:      ./target/release/lion-calculator
# Test:     cargo test
# WebAssembly (runs in the browser, see web/):
#   rustup target add wasm32-unknown-unknown
#   cargo build --target wasm32-unknown-unknown --profile wasm-release
#   wasm-bindgen --target web --out-dir web/pkg \
#     target/wasm32-unknown-unknown/wasm-release/lion_calculator.wasm

[lib]
name    = "lion_calculator"
path    = "src/lib.rs"
# rlib: native binary + tests · cdylib: wasm-bindgen JS glue
crate-type = ["rlib", "cdylib"]

[dependencies]
slint  = "1.17"
# Only need Local::now() + formatting — default features pull unneeded weight.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Browser build: same code, JS-provided clock (Local::now() via js_sys::Date).
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono        = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }
wasm-bindgen  = "0.2"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

# wasm-bindgen requires unwinding panics; everything else inherits release.
# Thin LTO: near-fat codegen quality at a fraction of the link time.
[profile.wasm-release]
inherits      = "release"
lto           = "thin"
panic         = "unwind"
strip         = false
